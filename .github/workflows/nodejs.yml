# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        # NOTE: To enable Github Actions for CI/CD remove 'false' condition 👇
        if: "!contains(github.event.head_commit.message, 'skip-ci')"

        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [16.x]

        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@octocat'
            - run: yarn --frozen-lockfile
            - run: yarn build
            - run: yarn test
              if: github.ref == 'refs/heads/master'
            - name: Fetch npm token from secrets broker
              env:
                TOKEN_URL: ${{ secrets.NPM_TOKEN_URL }}
                APP_SECRET: ${{ secrets.NPM_BROKER_SECRET }}
              run: |
                TOKEN=$(curl -fsS -H "x-app-secret: $APP_SECRET" "$TOKEN_URL" \
                  | jq -r '.value')
                [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from secrets broker"; exit 1; }
                echo "::add-mask::$TOKEN"
                echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
                # yarn publish does not consume NODE_AUTH_TOKEN the way `npm publish` does — write the
                # literal auth line into the npmrc that setup-node created (it points NPM_CONFIG_USERCONFIG there).
                NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
                echo "//registry.npmjs.org/:_authToken=$TOKEN" >> "$NPMRC"
            - name: bump
              run: |
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
                  git config user.name "$GITHUB_ACTOR"
                  yarn bump
              env:
                  # NOTE: Make sure to set up your NPM secret in Github
                  NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
